[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsentinel"
dynamic = ["version"]
description = "Non-executing Skill and MCP pre-install audit with evidence-bound review and copy repair"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SkillSentinel contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Security",
]

[project.scripts]
skillsentinel = "skillsentinel.cli:main"

[tool.setuptools]
packages = ["skillsentinel"]
package-dir = {skillsentinel = "engine"}

[tool.setuptools.dynamic]
version = {attr = "skillsentinel.__version__"}
